<form [formGroup]="formGroup">
  <frey-field>
    <frey-label>Nombre del Cliente </frey-label>
    <input
      freyInput
      formControlName="clientName"
      placeholder="Ingresa tu nombre"
      [readonly]="_isReadOnly()"
      freyInputValidation="name"
    />
  </frey-field>
  <frey-field>
    <frey-label>Nombre de la Mascota</frey-label>
    <input
      freyInput
      formControlName="petName"
      placeholder="Ingresa el nombre de tu mascota"
      [readonly]="_isReadOnly()"
      freyInputValidation="name"
    />
  </frey-field>

  <frey-field class="xs:col-12">
    <frey-prefix (click)="datepicker.open()">
      <i class="ms-filled">calendar_today</i>
    </frey-prefix>
    <frey-label>Fecha</frey-label>
    <input
      freyInput
      formControlName="date"
      [freyDatepicker]="datepicker"
      [readonly]="_isReadOnly()"
      [min]="minDate()"
    />
  </frey-field>

  <frey-timepicker
    formControlName="time"
    minTime="09:00:00"
    maxTime="18:00:00"
    [readonly]="_isReadOnly()"
  >
    <frey-label> Hora</frey-label>
  </frey-timepicker>

  <frey-field>
    <frey-label>Razón de la cita</frey-label>

    <textarea
      class="appointment__description"
      freyTextarea
      name="reason"
      id="reason"
      formControlName="reason"
      placeholder="Ingresa la razón de la cita"
      [readonly]="_isReadOnly()"
      freyInputValidation
    ></textarea>
  </frey-field>

  <ng-content></ng-content>
</form>

<frey-datepicker #datepicker> </frey-datepicker>
